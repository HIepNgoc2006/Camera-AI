[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ai-identity-service"
version = "0.1.0"
description = "Internal identity boundary for the Camera AI platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "argon2-cffi==25.1.0",
    "camera-ai-audit-producer==0.1.0",
    "camera-ai-crypto-runtime==0.1.0",
    "fastapi==0.139.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "PyJWT==2.13.0",
    "pyotp==2.10.0",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = [
    "httpx2==2.9.1",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
identity_service = ["py.typed"]
