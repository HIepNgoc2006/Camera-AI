[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ai-api-gateway"
version = "0.1.0"
description = "Security-first HTTP entry point for the Camera AI platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
