[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ai-ansvis-adapter"
version = "0.1.0"
description = "Fail-closed ANSVIS HTTP Trigger adapter for Camera AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "camera-ai-audit-producer==0.1.0",
    "camera-ai-consent-service==0.1.0",
    "camera-ai-metrics-runtime==0.1.0",
    "fastapi==0.139.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
    "uvicorn==0.52.0",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ansvis_adapter = ["py.typed"]
