[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ai-notification-service"
version = "0.1.0"
description = "Fail-closed notification intent and delivery baseline for Camera AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "camera-ai-audit-producer==0.1.0",
    "camera-ai-crypto-runtime==0.1.0",
    "camera-ai-metrics-runtime==0.1.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notification_service = ["py.typed"]
