name: Secret and repository safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tracked path and size policy
        run: python scripts/check_repository_safety.py

      - name: Test repository safety policy
        run: >-
          python -m unittest
          scripts.tests.test_check_repository_safety
          scripts.tests.test_fixture_safety
          scripts.tests.test_foundation_safety
          scripts.tests.test_compose_safety

      - name: Scan Git history with gitleaks
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --no-color

      - name: Prove fake canary is rejected safely
        shell: bash
        run: |
          canary_dir="$(mktemp -d)"
          printf 'ANSVIS_WEBHOOK_SECRET=%s%s\n' 'gltcanary_' 'A1B2C3D4E5F6G7H8' > "$canary_dir/canary.env"

          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$canary_dir:/canary:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir /canary --config /repo/.gitleaks.toml --redact --no-banner --no-color \
            > /tmp/gitleaks-canary.log 2>&1
          status=$?
          set -e

          rm -rf "$canary_dir" /tmp/gitleaks-canary.log
          if [ "$status" -ne 1 ]; then
            echo "canary_detection=FAIL status=$status"
            exit 1
          fi

          echo "canary_detection=PASS"
          echo "scanner_output_redacted=true"
