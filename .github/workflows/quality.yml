name: Baseline quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_ENV: test
      SCHOOL_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      AUDIT_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      CONSENT_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      CAMERA_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      EVENT_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      ATTENDANCE_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      TIMEKEEPING_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      NOTIFICATION_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      EVIDENCE_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
      REPORT_DATABASE_URI: postgresql+psycopg://postgres@127.0.0.1:55432/Camera_AI_school_test
    services:
      postgres-school-test:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_DB: Camera_AI_school_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d Camera_AI_school_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-quality.txt
            packages/audit-producer/pyproject.toml
            packages/authorization-runtime/pyproject.toml
            packages/crypto-runtime/pyproject.toml
            packages/metrics-runtime/pyproject.toml
            services/api-gateway/pyproject.toml
            services/identity-service/pyproject.toml
            services/school-service/pyproject.toml
            services/audit-log-service/pyproject.toml
            services/consent-service/pyproject.toml
            services/camera-registry-service/pyproject.toml
            services/ansvis-adapter/pyproject.toml
            services/attendance-service/pyproject.toml
            services/timekeeping-service/pyproject.toml
            services/notification-service/pyproject.toml
            services/evidence-service/pyproject.toml
            services/report-service/pyproject.toml
            workers/event-outbox-worker/pyproject.toml

      - name: Set up Node.js for Web Portal
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web-portal/.nvmrc
          package-manager-cache: false

      - name: Install pinned quality and backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-quality.txt
          -e "packages/audit-producer[test]"
          -e "packages/authorization-runtime[test]"
          -e "packages/crypto-runtime[test]"
          -e "packages/metrics-runtime[test]"
          -e "services/api-gateway[test]"
          -e "services/identity-service[test]"
          -e "services/school-service[test]"
          -e "services/audit-log-service[test]"
          -e "services/consent-service[test]"
          -e "services/camera-registry-service[test]"
          -e "services/ansvis-adapter[test]"
          -e "services/attendance-service[test]"
          -e "services/timekeeping-service[test]"
          -e "services/notification-service[test]"
          -e "services/evidence-service[test]"
          -e "services/report-service[test]"
          -e "workers/event-outbox-worker[test]"

      - name: Install pinned Web Portal dependencies
        working-directory: apps/web-portal
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run repository quality gates
        run: python scripts/quality.py all
