[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-ai-audit-producer"
version = "0.1.0"
description = "Shared audit-intent builder and fail-closed recorder port for Camera AI services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_ai_audit = ["py.typed"]
