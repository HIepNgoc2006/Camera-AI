[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py", "services/**/*.py"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "scripts",
    "services/api-gateway/src",
    "services/identity-service/src",
    "services/school-service/src",
    "services/audit-log-service/src",
    "services/consent-service/src",
]
pretty = true
show_error_codes = true
mypy_path = [
    "services/api-gateway/src",
    "services/identity-service/src",
    "services/school-service/src",
    "services/audit-log-service/src",
    "services/consent-service/src",
]

[tool.pytest.ini_options]
testpaths = [
    "scripts/tests",
    "services/api-gateway/tests",
    "services/identity-service/tests",
    "services/school-service/tests",
    "services/audit-log-service/tests",
    "services/consent-service/tests",
]
pythonpath = [
    ".",
    "services/api-gateway/src",
    "services/identity-service/src",
    "services/school-service/src",
    "services/consent-service/src",
]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "strict"
