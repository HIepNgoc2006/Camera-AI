[tool.ruff]
target-version = "py312"
line-length = 100
include = ["scripts/**/*.py"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts"]
pretty = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
